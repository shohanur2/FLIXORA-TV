name: Build FLIXORA TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        run: flutter create --platforms=android --org com.flixora --project-name flixora_tv .

      - name: Configure Android TV launcher support
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<category android:name="android.intent.category.LAUNCHER"/>'
          tv = '<category android:name="android.intent.category.LEANBACK_LAUNCHER"/>'
          if tv not in s:
              s = s.replace(marker, marker + '\n                ' + tv)
          if 'android.software.leanback' not in s:
              s = s.replace('</manifest>', '    <uses-feature android:name="android.software.leanback" android:required="false" />\n</manifest>')
          p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=TMDB_API_KEY="$TMDB_API_KEY" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flixora-tv-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
