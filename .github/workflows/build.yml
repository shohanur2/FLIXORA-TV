name: Build FLIXORA TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        run: flutter create --platforms=android --org com.flixora --project-name flixora_tv .

      - name: Configure Android TV launcher support
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          import re
          tv = '<category android:name="android.intent.category.LEANBACK_LAUNCHER" />'
          if 'android.intent.category.LEANBACK_LAUNCHER' not in s:
              s, count = re.subn(
                  r'(<category\\s+android:name="android\\.intent\\.category\\.LAUNCHER"\\s*/>)',
                  r'\\1\\n                ' + tv,
                  s,
                  count=1,
              )
              if count == 0:
                  raise SystemExit("Could not locate Android launcher category")
          if 'android.software.leanback' not in s:
              s = s.replace('</manifest>', '    <uses-feature android:name="android.software.leanback" android:required="false" />\\n</manifest>')
          s = re.sub(
              r'(<activity[^>]*android:name="[^"]*MainActivity"[^>]*)(>)',
              lambda m: m.group(1) if 'android:screenOrientation' in m.group(1) else m.group(1) + ' android:screenOrientation="landscape"' + m.group(2),
              s,
              count=1,
          )
          p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=TMDB_API_KEY="$TMDB_API_KEY" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flixora-tv-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
