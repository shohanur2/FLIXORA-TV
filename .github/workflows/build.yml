name: Build FLIXORA TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        run: flutter create --platforms=android --org com.flixora --project-name flixora_tv .

      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart

      - name: Configure Android TV launcher and landscape mode
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          leanback_category = '<category android:name="android.intent.category.LEANBACK_LAUNCHER" />'

          if "android.intent.category.LEANBACK_LAUNCHER" not in s:
              lines = s.splitlines()
              launcher_index = next(
                  (i for i, line in enumerate(lines)
                   if "android.intent.category.LAUNCHER" in line),
                  None,
              )
              if launcher_index is None:
                  raise SystemExit("Could not locate Android launcher category. Manifest contents:\n" + s)
              indent = lines[launcher_index][:len(lines[launcher_index]) - len(lines[launcher_index].lstrip())]
              lines.insert(launcher_index + 1, indent + leanback_category)
              s = "\n".join(lines) + "\n"

          if "android.software.leanback" not in s:
              s = s.replace(
                  "</manifest>",
                  '    <uses-feature android:name="android.software.leanback" android:required="false" />\n</manifest>',
              )

          activity_start = s.find("<activity")
          while activity_start != -1:
              activity_end = s.find(">", activity_start)
              tag = s[activity_start:activity_end + 1]
              if "MainActivity" in tag:
                  if "android:screenOrientation" not in tag:
                      s = s[:activity_end] + ' android:screenOrientation="landscape"' + s[activity_end:]
                  break
              activity_start = s.find("<activity", activity_end + 1)

          p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \\
            --dart-define=TMDB_API_KEY="$TMDB_API_KEY" \\
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \\
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flixora-tv-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
